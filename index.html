function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function shapeParts(s,r){ // 팡팡이 모양 (중심 0,0 · 반지름 r) → Path2D 묶음
 const P=[];const p=()=>{const q=new Path2D();P.push(q);return q};
 if(s==='heart'){const q=p(),f=r/17;q.moveTo(0,16*f);q.bezierCurveTo(-12*f,9*f,-17*f,2*f,-17*f,-5*f);q.bezierCurveTo(-17*f,-12*f,-12*f,-16*f,-7*f,-16*f);q.bezierCurveTo(-3*f,-16*f,-1*f,-14*f,0,-11*f);q.bezierCurveTo(1*f,-14*f,3*f,-16*f,7*f,-16*f);q.bezierCurveTo(12*f,-16*f,17*f,-12*f,17*f,-5*f);q.bezierCurveTo(17*f,2*f,12*f,9*f,0,16*f);q.closePath()}
 else if(s==='star'){const q=p();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.58:r*1.05;const X=Math.cos(a)*rad,Y=Math.sin(a)*rad+r*.06;i?q.lineTo(X,Y):q.moveTo(X,Y)}q.closePath()}
 else if(s==='drop'){const q=p();q.moveTo(0,-r*1.15);q.bezierCurveTo(r*.35,-r*.55,r*.95,-r*.1,r*.95,r*.3);q.arc(0,r*.3,r*.95,0,Math.PI);q.bezierCurveTo(-r*.95,-r*.1,-r*.35,-r*.55,0,-r*1.15);q.closePath()}
 else if(s==='cloud'){for(const [x,y,k] of [[-.5,.2,.55],[.5,.2,.55],[0,-.15,.62],[-.25,.4,.5],[.25,.4,.5]]){const q=p();q.arc(x*r,y*r,k*r,0,7)}}
 else if(s==='dia'){const q=p();q.moveTo(0,-r);q.lineTo(r*.9,-r*.15);q.lineTo(0,r*1.02);q.lineTo(-r*.9,-r*.15);q.closePath()}
 else if(s==='clover'){for(const [x,y] of [[0,-.45],[-.45,0],[.45,0],[0,.45]]){const q=p();q.arc(x*r,y*r,r*.52,0,7)}const q=p();q.arc(0,0,r*.4,0,7)}
 else{const q=p();q.arc(0,0,r,0,7)}
 return P}
function drawPang(g,ch,cx,cy,r,face,back){ // 쿠키런풍: 두꺼운 외곽선 + 입체 광택 + 표정
 const C=CH[ch],P=shapeParts(C.s,r),ol=Math.max(2,r*.16);g.save();g.translate(cx,cy);g.lineJoin='round';
 g.strokeStyle=OL;g.lineWidth=ol*2;for(const q of P)g.stroke(q);
 const gr=g.createRadialGradient(-r*.35,-r*.45,r*.1,0,0,r*1.15);gr.addColorStop(0,C.l);gr.addColorStop(.45,C.c);gr.addColorStop(1,C.d);g.fillStyle=gr;for(const q of P)g.fill(q);
 g.save();const clip=new Path2D();for(const q of P)clip.addPath(q);g.clip(clip);
 g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-r*.38,-r*.5,r*.26,r*.15,-.5,0,7);g.fill();
 g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(r*.1,r*.85,r*.9,r*.35,0,0,7);g.fill();g.restore();
 if(face&&!back){const e=r*.3,ey=-r*.05;g.fillStyle=OL;for(const sx of[-1,1]){g.beginPath();g.ellipse(sx*e,ey,r*.11,r*.15,0,0,7);g.fill()}g.fillStyle='#fff';for(const sx of[-1,1]){g.beginPath();g.arc(sx*e+r*.04,ey-r*.06,r*.045,0,7);g.fill()}

 g.restore()}

function startRace(seed){unlock();['ovTitle','ovSetup','ovOver','ovPause','ovRank'].forEach(hide);lastWin=null;setupRace(seed);state='count';cdT=3;$('cd').hidden=false;$('cd').textContent='';$('ctl2').hidden=false;resize();hud()}
function onFinish(){sfx.fin();toast(ME.place===1?'1등! WIN!':ME.place+'등 골인!');bgm(false);
 if(VS&&window.PHVS&&PHVS.active){const sc=[0,1000,800,600,400,200,100][ME.place]||0;send({t:'fin',f:ME.fin});setTimeout(()=>{if(!PHVS.active)return;if(!OPP.fin)PHVS.claimWin(sc);else PHVS.over(sc,false)},1500)}}
function showResult(){state='done';bgm(false);$('ctl2').hidden=true;
 for(const r of RC)if(!r.fin){const left=LAPS*L-r.d;r.fin=tRace+left/(Math.max(.3,r.spd)*MAX)}
 const s=places();lastWin={s:Math.round(ME.fin*100),m:cfg.map+'-'+cfg.it+'-'+cfg.lv,v:ME.place,saved:false};
 $('overTitle').textContent=ME.place===1?'1ST WIN!':ME.place+(ME.place===2?'ND':ME.place===3?'RD':'TH')+' PLACE';

 $('res').innerHTML=s.map((r,i)=>`<div class="${r===ME?'me':''}"><b>${i+1}</b><canvas data-c="${r.ch}" width="68" height="52"></canvas><span>${esc(r===ME?(store.get('kart-name')||'나'):r.nm)}</span><em>${fmt(r.fin)}</em></div>`).join('');
 $('res').querySelectorAll('canvas').forEach(c=>{const g=c.getContext('2d');g.drawImage(KF[+c.dataset.c],0,0,68,56)});
 $('nameIn').value=store.get('kart-name')||'';$('bSave').textContent='OK';$('bSave').disabled=false;show('ovOver')}
function pause(on){if(VS)return;if(on&&state==='race'){state='pause';bgm(false);show('ovPause')}else if(!on&&state==='pause'){state='race';bgm(true);hide('ovPause')}}
$('bPause').onclick=()=>pause(state==='race');$('bResume').onclick=()=>pause(false);
$('bRestart').onclick=()=>startRace();$('bRetry').onclick=()=>startRace();

const KF=[];
function setupUI(){KS.length=0;KF.length=0;for(let c=0;c<6;c++){KS.push([-1,0,1].map(s=>kartRear(c,s)));KF.push(kartFront(c))}
 $('maps').innerHTML=MAPS.map((m,i)=>`<button data-i="${i}"><canvas width="120" height="60"></canvas><span>${m.n}</span></button>`).join('');
 $('maps').querySelectorAll('canvas').forEach((c,i)=>{const g=c.getContext('2d'),m=MAPS[i],gr=g.createLinearGradient(0,0,0,30);gr.addColorStop(0,m.sky[0]);gr.addColorStop(1,m.sky[1]);g.fillStyle=gr;g.fillRect(0,0,120,30);g.fillStyle=m.hill;g.beginPath();g.moveTo(0,32);for(let X=0;X<=120;X+=10)g.lineTo(X,22+Math.sin(X/14+i)*5);g.lineTo(120,32);g.fill();g.fillStyle=m.grass[0];g.fillRect(0,30,120,30);g.fillStyle=m.rum[0];g.beginPath();g.moveTo(52,30);g.lineTo(68,30);g.lineTo(110,60);g.lineTo(10,60);g.fill();g.fillStyle=m.road[0];g.beginPath();g.moveTo(54,30);g.lineTo(66,30);g.lineTo(100,60);g.lineTo(20,60);g.fill();const P=PROP[m.props[0]];g.drawImage(P.c,8,8,22,22*P.c.height/P.c.width);g.drawImage(P.c,92,12,18,18*P.c.height/P.c.width)});
 $('chs').innerHTML=CH.map((c,i)=>`<button data-i="${i}"><canvas width="84" height="70"></canvas><span>${c.n}</span></button>`).join('');
 $('chs').querySelectorAll('canvas').forEach((c,i)=>c.getContext('2d').drawImage(KF[i],0,0,84,70));
 const sync=()=>{$('maps').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===cfg.map));$('chs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===cfg.ch));$('selIt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.it));$('selLv').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.lv));store.set('kart-cfg',JSON.stringify(cfg))};
 $('maps').onclick=e=>{const b=e.target.closest('button');if(b){cfg.map=+b.dataset.i;sync()}};$('chs').onclick=e=>{const b=e.target.closest('button');if(b){cfg.ch=+b.dataset.i;sync()}};
 $('selIt').onclick=e=>{const b=e.target.closest('button');if(b){cfg.it=b.dataset.v;sync()}};$('selLv').onclick=e=>{const b=e.target.closest('button');if(b){cfg.lv=b.dataset.v;sync()}};sync();
 const show2=$('show');show2.innerHTML='';for(let i=0;i<4;i++){const c=cnv(110,90);c.getContext('2d').drawImage(KF[(i+1)%6],0,0,110,90);c.style.cssText='width:64px;height:52px;animation:kb 1.2s ease-in-out '+(-i*.3)+'s infinite';show2.appendChild(c)}
 const st=document.createElement('style');st.textContent='#show{display:flex;gap:4px;justify-content:center}@keyframes kb{50%{transform:translateY(-6px)}}';document.head.appendChild(st)}
let PK='single';
function openSetup(k){PK=k;$('suT').textContent=k==='online'?'ONLINE PLAY':'SINGLE PLAY';$('bGo').textContent=k==='online'?'NEXT':'START';hide('ovTitle');show('ovSetup')}
$('bSingle').onclick=()=>{unlock();openSetup('single')};$('bOnline').onclick=()=>{unlock();openSetup('online')};$('bSuX').onclick=()=>{hide('ovSetup');show('ovTitle')};
const TUT={"goal": "팡팡이 카트로 3바퀴! 먼저 들어오면 1등.<br>SPEED: 드리프트로 게이지를 모아 부스터 (최대 2개)<br>ITEM: 무지개 상자에서 부스터·바나나·미사일·실드·물풍선", "touch": [["◀ ▶", "핸들 (화면 왼쪽·오른쪽 눌러도 돼요)"], ["DRIFT", "누른 채 꺾으면 드리프트"], ["ITEM", "부스터 · 아이템 쓰기"]], "pc": [["← →", "핸들"], ["SHIFT", "드리프트"], ["SPACE", "부스터 · 아이템"]]};
$('bGo').onclick=()=>{unlock();if(PK==='online'){hide('ovSetup');if(window.PHVS)PHVS.menu();return}phTut('kart-tut',TUT,()=>startRace())};
/* ===== 온라인 대전 (방 코드 1:1 · 나머지는 AI) ===== */
let VSHOST=false,netT=0;
function send(d){if(window.PHVS&&PHVS.active)PHVS.send(d)}
const outId=id=>ME&&id===ME.id?'opp':id==='opp'?'@me':id,inId=id=>id==='@me'?(ME&&ME.id):id;
function netTick(dt){for(const r of RC){if(!(r.remote||(VS&&!VS.host&&r.ai)))continue;r.td+=r.spd*MAX*dt;r.d+=r.spd*MAX*dt;r.d+=(r.td-r.d)*Math.min(1,dt*6);r.x+=(r.tx-r.x)*Math.min(1,dt*8);r.z=zOf(r.d)}
 netT-=dt;if(netT>0)return;netT=.1;
 send({t:'st',d:Math.round(ME.d),x:+ME.x.toFixed(3),s:+ME.spd.toFixed(3),st:+ME.steer.toFixed(2),b:ME.boost>0?1:0,sh:ME.shield>0?1:0,sp:ME.spin>0?1:0,tr:ME.trap>0?1:0,ch:cfg.ch,nm:store.get('kart-name')||'친구'});
 if(VS.host)send({t:'ai',a:RC.filter(r=>r.ai).map(r=>[r.id,Math.round(r.d),+r.x.toFixed(3),+r.spd.toFixed(3),+r.steer.toFixed(2),r.boost>0?1:0,r.shield>0?1:0,r.spin>0?1:0,r.trap>0?1:0,r.fin||0])});
 if(window.PHVS&&PHVS.active&&ME)PHVS.score(ME.place+'등 · LAP '+clamp(Math.floor(Math.max(0,ME.d)/L)+1,1,LAPS))}
function onNet(d){if(!VS)return;
 if(d.t==='st'&&OPP){if(!OPP.seen){OPP.d=OPP.td=d.d;OPP.seen=1}OPP.td=d.d;OPP.tx=d.x;OPP.spd=d.s;OPP.steer=d.st;OPP.boost=d.b;OPP.shield=d.sh;OPP.spin=d.sp;OPP.trap=d.tr;if(OPP.ch!==d.ch)OPP.ch=d.ch;OPP.nm=String(d.nm||'친구').slice(0,8)}
 else if(d.t==='ai'&&!VS.host){for(const a of d.a){const r=RC.find(o=>o.id===a[0]);if(!r)continue;if(!r.seen){r.d=r.td=a[1];r.seen=1}r.td=a[1];r.tx=a[2];r.spd=a[3];r.steer=a[4];r.boost=a[5];r.shield=a[6];r.spin=a[7];r.trap=a[8];if(a[9])r.fin=a[9]}}
 else if(d.t==='hz'){const h=Object.assign({},d.h);h.owner=inId(h.owner);if(h.tgt)h.tgt=inId(h.tgt);h.age=0;if(!HZ.some(o=>o.id===h.id))HZ.push(h)}
 else if(d.t==='rm'){HZ=HZ.filter(h=>h.id!==d.id)}
 else if(d.t==='fin'&&OPP){OPP.fin=d.f}
 else if(d.t==='af'){const r=RC.find(o=>o.id===d.id);if(r)r.fin=d.f}}
const send0=send;send=function(d){if(d&&d.t==='hz'){d=Object.assign({},d,{h:Object.assign({},d.h,{owner:outId(d.h.owner),tgt:d.h.tgt?outId(d.h.tgt):undefined})})}send0(d)};
addEventListener('load',()=>{if(!window.PHVS){$('bOnline').hidden=true;return}
 PHVS.init({id:'kart',name:()=>store.get('kart-name')||'',setName:n=>store.set('kart-name',n),score:()=>ME?([0,1000,800,600,400,200,100][ME.place]||0):0,
  extra:()=>{VSHOST=true;return{map:cfg.map,it:cfg.it,lv:cfg.lv}},
  start:d=>{if(d.map!=null)cfg.map=d.map;cfg.it=d.it||cfg.it;cfg.lv=d.lv||cfg.lv;VS={host:VSHOST};startRace(d.seed)},
  data:onNet,stop:()=>{state='done';bgm(false);$('ctl2').hidden=true},leave:()=>{VS=null;VSHOST=false;OPP=null;toMenu()}})});
$('bOnline').addEventListener('click',()=>{VSHOST=false});

/* ===== 랭킹 (맵·모드별 베스트 타임) ===== */
let RKM=0,RKI='s',RROWS=null;
const MS=['캔디','사막','눈꽃','해변','네온','화산'];
$('rkMap').innerHTML=MS.map((n,i)=>`<button data-v="${i}" style="font:11px Galmuri11,sans-serif;padding:7px 0">${n}</button>`).join('');
function rkSync(){$('rkMap').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===RKM));$('rkIt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===RKI))}
$('rkMap').onclick=e=>{const b=e.target.closest('button');if(b){RKM=+b.dataset.v;rkSync();rkRender()}};$('rkIt').onclick=e=>{const b=e.target.closest('button');if(b){RKI=b.dataset.v;rkSync();rkRender()}};
function local(){try{return JSON.parse(store.get('kart-ranks')||'[]')}catch(e){return[]}}
function rkRender(){const el=$('rankList');if(!RROWS){el.innerHTML='<span class="em">LOADING…</span>';return}
 const rows=RROWS.filter(r=>String(r.m).indexOf(RKM+'-'+RKI+'-')===0&&+r.s>0).sort((a,b)=>a.s-b.s).slice(0,50),mw=lastWin&&lastWin.saved?lastWin:null;let mk=false;
 el.innerHTML=rows.length?rows.map((r,i)=>{let c='';if(mw&&!mk&&r.n===mw.n&&+r.s===mw.s){c='me';mk=true}const lv=String(r.m).split('-')[2];return `<div class="${c}"><span class="r">${i+1}</span><span>${esc(r.n)}${window.phLv?phLv(({e:'EASY',n:'NORMAL',h:'HARD'})[lv]||''):''}</span><span class="s">${fmt(r.s/100)}</span><span class="m">${r.v?r.v+'등':''}</span></div>`}).join(''):'<span class="em">아직 기록이 없어요</span>'}
async function openRank(){if(state==='race')pause(true);if(lastWin){RKM=+lastWin.m.split('-')[0];RKI=lastWin.m.split('-')[1]}else{RKM=cfg.map;RKI=cfg.it}rkSync();show('ovRank');RROWS=null;rkRender();try{const j=await fetch(RANK_URL+'?g=kart').then(r=>r.json());RROWS=j.top||[]}catch(e){RROWS=local()}rkRender()}
$('bRank').onclick=openRank;$('bRank2').onclick=openRank;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));
$('bSave').onclick=async()=>{if(!lastWin||lastWin.saved)return;const n=($('nameIn').value.trim()||'익명').slice(0,8);store.set('kart-name',n);lastWin.saved=true;lastWin.n=n;$('bSave').textContent='…';$('bSave').disabled=true;
 const l=local();l.push({n,s:lastWin.s,v:lastWin.v,m:lastWin.m});store.set('kart-ranks',JSON.stringify(l.slice(-300)));
 try{await fetch(`${RANK_URL}?g=kart&a=add&n=${encodeURIComponent(n)}&s=${lastWin.s}&v=${lastWin.v}&m=${lastWin.m}`)}catch(e){}$('bSave').textContent='✓';openRank()};

})();
